name: Build and release AdRulesUltra rulesets

on:
  workflow_dispatch:
  schedule:
    - cron: "23 20 * * *"

permissions:
  contents: write

concurrency:
  group: build-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout converter
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Fetch upstream rules
        run: |
          git clone --depth=1 https://github.com/liuzq2002/Adguard-Home-For-Magisk-Mod upstream-adguard
          git clone --depth=1 https://github.com/privacy-protection-tools/anti-AD upstream-anti-ad
          curl -fsSL https://raw.githubusercontent.com/privacy-protection-tools/dead-horse/master/anti-ad-white-for-clash.yaml -o upstream-anti-ad/anti-ad-white-for-clash.yaml
          curl -fsSL https://raw.githubusercontent.com/lingeringsound/10007/main/reward -o upstream-coolapk-1007-reward.txt
          echo "ADGUARD_SHA=$(git -C upstream-adguard rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "ANTI_AD_SHA=$(git -C upstream-anti-ad rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "DEAD_HORSE_SHA=$(sha256sum upstream-anti-ad/anti-ad-white-for-clash.yaml | cut -d ' ' -f 1)" >> "$GITHUB_ENV"
          echo "COOLAPK_1007_REWARD_SHA=$(sha256sum upstream-coolapk-1007-reward.txt | cut -d ' ' -f 1)" >> "$GITHUB_ENV"
          echo "RELEASE_DATE=$(date -u +%Y%m%d)" >> "$GITHUB_ENV"

      - name: Build text rule providers
        run: |
          uv run python -m scripts.build_rulesets \
            --adguard-source upstream-adguard \
            --anti-ad-source upstream-anti-ad \
            --coolapk-1007-reward-source upstream-coolapk-1007-reward.txt \
            --output dist \
            --adguard-commit "$ADGUARD_SHA" \
            --anti-ad-commit "$ANTI_AD_SHA" \
            --dead-horse-commit "$DEAD_HORSE_SHA" \
            --coolapk-1007-reward-commit "$COOLAPK_1007_REWARD_SHA"

      - name: Guard ads text against path-widened canaries
        run: |
          set -euo pipefail
          # .mrs / .srs 由下列文本/json 编译; 先保证编译输入不含整域误杀 canary.
          # 当前 canary 来自 issue #1: ||claude.ai/sentry^ 不得扩大为 +.claude.ai
          canaries=(
            '+.claude.ai'
            '||claude.ai^'
            'DOMAIN-SUFFIX,claude.ai'
            'address=/claude.ai/'
          )
          ads_sources=(
            dist/adrules_ultra_ads.txt
            dist/adrules_ultra_ads_clash.yaml
            dist/adrules_ultra_ads_domains.txt
            dist/adrules_ultra_ads_surge.txt
            dist/adrules_ultra_ads_surge2.txt
            dist/adrules_ultra_ads_dnsmasq.conf
            dist/adrules_ultra_ads_smartdns.conf
            dist/adrules_ultra_ads_adguard.txt
            dist/adrules_ultra_ads_easylist.txt
            dist/adrules_ultra_ads_singbox.json
          )
          for file in "${ads_sources[@]}"; do
            if [ ! -f "$file" ]; then
              echo "missing ads source for release compile: $file" >&2
              exit 1
            fi
            if grep -F -e 'claude.ai' "$file"; then
              echo "ads canary failed: $file still contains claude.ai" >&2
              exit 1
            fi
            for token in "${canaries[@]}"; do
              if grep -F -e "$token" "$file"; then
                echo "ads canary failed: $file still contains $token" >&2
                exit 1
              fi
            done
          done

      - name: Install latest mihomo
        run: |
          python3 - <<'PY' > /tmp/mihomo_url
          from __future__ import annotations

          import json
          import urllib.request

          with urllib.request.urlopen("https://api.github.com/repos/MetaCubeX/mihomo/releases/latest", timeout=30) as response:
              release = json.load(response)
          for asset in release["assets"]:
              name = asset["name"]
              if name.startswith("mihomo-linux-amd64-") and name.endswith(".gz") and "-go" not in name:
                  print(asset["browser_download_url"])
                  raise SystemExit(0)
          raise SystemExit("missing linux amd64 mihomo asset")
          PY
          curl -fsSL "$(cat /tmp/mihomo_url)" -o /tmp/mihomo.gz
          gzip -d /tmp/mihomo.gz
          chmod +x /tmp/mihomo
          /tmp/mihomo -v

      - name: Install latest sing-box
        run: |
          python3 - <<'PY' > /tmp/singbox_url
          from __future__ import annotations

          import json
          import urllib.request

          with urllib.request.urlopen("https://api.github.com/repos/SagerNet/sing-box/releases/latest", timeout=30) as response:
              release = json.load(response)
          for asset in release["assets"]:
              name = asset["name"]
              if name.startswith("sing-box-") and name.endswith("-linux-amd64.tar.gz") and "musl" not in name and "glibc" not in name:
                  print(asset["browser_download_url"])
                  raise SystemExit(0)
          raise SystemExit("missing linux amd64 sing-box asset")
          PY
          curl -fsSL "$(cat /tmp/singbox_url)" -o /tmp/sing-box.tgz
          mkdir -p /tmp/sing-box-extract
          tar -xzf /tmp/sing-box.tgz -C /tmp/sing-box-extract
          install -m 755 "$(find /tmp/sing-box-extract -type f -name sing-box | head -n 1)" /tmp/sing-box
          /tmp/sing-box version

      - name: Convert to MRS and SRS
        run: |
          set -euo pipefail
          for file in dist/adrules_ultra_ads.txt dist/adrules_ultra_allow.txt dist/adrules_ultra_malware.txt; do
            /tmp/mihomo convert-ruleset domain text "$file" "${file%.txt}.mrs"
          done
          for file in dist/adrules_ultra_ads_ipcidr.txt dist/adrules_ultra_allow_ipcidr.txt dist/adrules_ultra_malware_ipcidr.txt; do
            if [ -s "$file" ]; then
              /tmp/mihomo convert-ruleset ipcidr text "$file" "${file%.txt}.mrs"
            fi
          done
          for file in dist/adrules_ultra_ads_singbox.json dist/adrules_ultra_allow_singbox.json dist/adrules_ultra_malware_singbox.json; do
            /tmp/sing-box rule-set compile --output "${file%.json}.srs" "$file"
          done
          uv run python -m scripts.ruleset_stats --output dist
          find dist -maxdepth 1 -type f -size 0 -delete
          find dist -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > dist/SHA256SUMS
          sha256sum -c dist/SHA256SUMS

      - name: Prepare release notes
        run: |
          {
            echo "# AdRulesUltra multi-format rulesets"
            echo
            echo "- Upstream: https://github.com/liuzq2002/Adguard-Home-For-Magisk-Mod"
            echo "- Upstream commit: \`$ADGUARD_SHA\`"
            echo "- Upstream: https://github.com/privacy-protection-tools/anti-AD"
            echo "- Upstream commit: \`$ANTI_AD_SHA\`"
            echo "- Upstream: https://raw.githubusercontent.com/privacy-protection-tools/dead-horse/master/anti-ad-white-for-clash.yaml"
            echo "- Upstream SHA256: \`$DEAD_HORSE_SHA\`"
            echo "- Upstream: https://raw.githubusercontent.com/lingeringsound/10007/main/reward"
            echo "- Upstream SHA256: \`$COOLAPK_1007_REWARD_SHA\`"
            echo "- Generated at: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            cat dist/manifest.md
          } > release-notes.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: snapshot-${{ env.ADGUARD_SHA }}-${{ env.ANTI_AD_SHA }}-${{ env.DEAD_HORSE_SHA }}-${{ env.COOLAPK_1007_REWARD_SHA }}
          name: AdRulesUltra rulesets ${{ env.RELEASE_DATE }}
          body_path: release-notes.md
          files: |
            dist/*.mrs
            dist/*.srs
            dist/*.txt
            dist/*.yaml
            dist/*.json
            dist/*.conf
            dist/manifest.md
            dist/stats.json
            dist/SHA256SUMS
          make_latest: true
          overwrite_files: true
